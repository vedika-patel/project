    <title>Document</title>
    <style>
        body{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .join {
        width: 130px;
        height: 55px;
        border: none;
        border-radius: 10px;
        background: darkblue;
        color: white;
        font-size: 20px;
        font-weight: bold;
    }
    .header {
        color:#EBF0F3;
        text-align: center;
        font-size: 28px;
        font-weight: bold;
        position: relative;
        margin-bottom: 25px;
        
        
    }
    
    .preview {
        width: 88%;
        height: 720px;
        margin: auto;
        background: #252b30;
        border-radius: 18px;
        position: relative;
        padding: 20px;
    }

    .control{
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background-color:silver;
        border-radius: 10px;
        height: 70px;
        width: 825px;
        padding: 0px;
        position: absolute;
        left: 350px;
        
        
    }
    .phone{
        display: block;
        border: 3px solid red;
        border-radius: 50px;
        align-items: center;
        justify-content: center;
        height: 900px;
        width: 900px;
        background-color: black;
    }
    .text{
        border: 1px solid rgb(167, 127, 67);
        display: block;
        justify-content: center;
        align-items: center;
    }
     .name {
        position: absolute;
        bottom: 35px;
        left: 25px;
        background: #050505;
        color: white;
        padding: 15px 20px;
        border-radius: 12px;
    }

    .name strong {
        display: block;
        font-size: 22px;
        margin-bottom: 7px;
    }

    .profile {
        position: absolute;
        top: 270px;
        left: 50%;
        transform: translateX(-50%);
        width: 230px;
        height: 230px;
        border-radius: 50%;
        overflow: hidden;
        background: #555;
    }

    .profile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    </style>
